<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="scanbeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e94560" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#e94560" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="fridgeclip">
      <rect x="58" y="42" width="124" height="162" rx="12"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="240" height="240" fill="#0f0f1a" rx="24"/>

  <!-- Fridge body -->
  <rect x="58" y="42" width="124" height="162" rx="12" fill="#1a1a2e" stroke="#e94560" stroke-width="3"/>

  <!-- Freezer divider -->
  <line x1="58" y1="115" x2="182" y2="115" stroke="#e94560" stroke-width="2.5"/>

  <!-- Fridge handle (top) -->
  <rect x="158" y="60" width="8" height="40" rx="4" fill="#e94560"/>
  <!-- Fridge handle (bottom) -->
  <rect x="158" y="125" width="8" height="40" rx="4" fill="#3a5a8a"/>

  <!-- CV scanning beam inside fridge -->
  <rect x="58" y="42" width="124" height="162" rx="12" fill="none" clip-path="url(#fridgeclip)"/>
  <rect x="60" y="55" width="118" height="55" fill="url(#scanbeam)" opacity="0.25" clip-path="url(#fridgeclip)"/>

  <!-- Scan line -->
  <line x1="62" y1="82" x2="178" y2="82" stroke="#e94560" stroke-width="1.5" opacity="0.9"/>

  <!-- Scan corner brackets (CV camera overlay) -->
  <!-- Top-left -->
  <path d="M66 50 L66 62 M66 50 L78 50" stroke="#4caf50" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Top-right -->
  <path d="M174 50 L174 62 M174 50 L162 50" stroke="#4caf50" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Bottom corners of scan zone -->
  <path d="M66 106 L66 94 M66 106 L78 106" stroke="#4caf50" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M174 106 L174 94 M174 106 L162 106" stroke="#4caf50" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Items in freezer (detected, highlighted) -->
  <rect x="70" y="56" width="28" height="20" rx="4" fill="#3a5a8a" opacity="0.7"/>
  <rect x="104" y="58" width="22" height="18" rx="4" fill="#3a5a8a" opacity="0.5"/>
  <rect x="132" y="55" width="30" height="22" rx="4" fill="#3a5a8a" opacity="0.7"/>

  <!-- Detection dots -->
  <circle cx="84"  cy="66" r="3" fill="#4caf50"/>
  <circle cx="115" cy="67" r="3" fill="#4caf50"/>
  <circle cx="147" cy="66" r="3" fill="#4caf50"/>

  <!-- Items in main fridge -->
  <rect x="70"  y="122" width="18" height="32" rx="3" fill="#2a2a4a" stroke="#3a5a8a" stroke-width="1.5"/>
  <rect x="95"  y="128" width="18" height="26" rx="3" fill="#2a2a4a" stroke="#3a5a8a" stroke-width="1.5"/>
  <rect x="120" y="120" width="22" height="34" rx="3" fill="#2a2a4a" stroke="#3a5a8a" stroke-width="1.5"/>
  <rect x="150" y="125" width="18" height="29" rx="3" fill="#2a2a4a" stroke="#3a5a8a" stroke-width="1.5"/>

  <!-- Label -->
  <text x="120" y="222" text-anchor="middle" fill="#e0e0f0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="2">KITCHEN AGENT</text>
</svg>
