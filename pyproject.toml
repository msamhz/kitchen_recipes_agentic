[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kitchen-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "beautifulsoup4",
    "fastapi",
    "httpx",
    "mangum",
    "numpy",
    "optimum[onnxruntime]",
    "Pillow",
    "pgvector",
    "psycopg2-binary",
    "python-dotenv",
    "python-multipart",
    "requests",
    "sentence-transformers",
    "uvicorn",
    "yt-dlp",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line too long
    "F401",  # imported but unused
    "E402",  # module-level import not at top
]
